<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Відкрийте для себе наші неперевершені десерти, приготовані з любов'ю та увагою до деталей. Кожен шматочок — це справжнє свято смаку!"
    />

    <meta
      name="keywords"

    <meta name="author" content="Sweet Factory" />

      content="Відкрийте для себе наші неперевершені десерти, приготовані з любов'ю"

      property="og:description"

    />

    <meta property="og:type" content="website" />
    <link
      rel="preload"
      href="./fonts/Comfortaa-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/WorkSans-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/WorkSans-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/WorkSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="./css/styles.css" as="style" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Sweet Factory</title>
  </head>
  <body>
    <header class="header">
      <div class="container"></div>

    <main>
      <section class="hero">
        <div class="container hero-container">

      <section class="deserts">
        <div class="container"></div>
      </section>
      <section class="about-us">
        <div class="container"></div>
      </section>
      <section class="feedback">
        <div class="container"></div>
      </section>
      <section class="faq-section">
        <div class="container"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="container"></div>
    </footer>

    <div class="form-wrapper">
      <div class="container"></div>
    </div>

    <script type="module" src="./main.js"></script>
