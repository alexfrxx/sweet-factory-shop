<div class="modal-form" id="modal-form" hidden>
  <div class="modal-form-overlay" data-modal-close></div>
  <div
    class="modal-form-window"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-form-title"
  >
    <button
      class="modal-form-close"
      type="button"
      data-modal-close
      aria-label="Закрити"
    >
      <svg
        class="modal-form-close-icon"
        width="24"
        height="24"
        aria-hidden="true"
      >
        <use href="./img/sprite.svg#cross"></use>
      </svg>
    </button>

    <h2 class="modal-form-title" id="modal-form-title">Офомлення замовлення</h2>

    <form class="modal-form-form">
      <div class="modal-form-field">
        <label class="modal-form-label" for="modal-form-name">Ім’я*</label>
        <input
          class="modal-form-input"
          type="text"
          id="modal-form-name"
          name="name"
          placeholder="Вікторія"
          autocomplete="name"
          required
        />
        <span class="modal-form-error"></span>
      </div>

      <div class="modal-form-field">
        <label class="modal-form-label" for="modal-form-phone">Телефон*</label>
        <input
          class="modal-form-input"
          type="tel"
          id="modal-form-phone"
          name="phone"
          placeholder="+38 0__ ___ __ __"
          autocomplete="tel"
          title="Формат: +380XXXXXXXXX"
          required
        />
        <span class="modal-form-error"></span>
      </div>

      <div class="modal-form-field">
        <label class="modal-form-label" for="modal-form-comment"
          >Коментар*</label
        >
        <textarea
          class="modal-form-textarea"
          id="modal-form-comment"
          name="comment"
          placeholder="Ваш коментар"
          required
        ></textarea>
        <span class="modal-form-error"></span>
      </div>

      <button class="modal-form-submit btn" type="submit">
        Надіслати заявку
      </button>
    </form>
  </div>
</div>
