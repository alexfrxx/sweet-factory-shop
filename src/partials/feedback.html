<section class="feedback" id="feedback">
  <div class="container">
    <h2 class="title-feedback">Відгуки клієнтів</h2>
    <p class="text-feedback">Найкращі десерти, які я коли-небудь куштував!</p>

    <div class="feedback-container">
      <div class="swiper feedback-swiper">
        <ul class="swiper-wrapper feedback-list"></ul>
      </div>

      <div class="nav-wrapper">
        <div class="swiper-pagination feedback-pagination"></div>
        <div class="button-wrapper">
          <div class="feedback-button-prev swiper-button">
            <svg width="24" height="24" aria-hidden="true">
              <use href="./img/sprite.svg#arrow-left"></use>
            </svg>
          </div>
          <div class="feedback-button-next swiper-button">
            <svg width="24" height="24" aria-hidden="true">
              <use href="./img/sprite.svg#arrow-right"></use>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
